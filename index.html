            { college: "醫學院", deptCat: "其他醫學", school: "高雄醫學", dept: "運動醫學系", group: "", quota: 2, subjects: ["英文", "普通生物"] },
            { college: "醫學院", deptCat: "其他醫學", school: "中山醫學", dept: "視光學系", group: "", quota: 3, subjects: ["英文", "普通生物"] },
            { college: "醫學院", deptCat: "其他醫學", school: "中山醫學", dept: "醫療產業科技管理學系", group: "", quota: 2, subjects: ["國文", "英文"] },
            { college: "醫學院", deptCat: "其他醫學", school: "中山醫學", dept: "健康產業科技管理學系", group: "", quota: 3, subjects: ["英文", "普通生物"] },
            { college: "醫學院", deptCat: "其他醫學", school: "銘傳大學", dept: "醫療資訊管理學系", group: "", quota: 6, subjects: ["書審"] },
            { college: "醫學院", deptCat: "其他醫學", school: "中山醫學", dept: "職業安全衛生學系", group: "", quota: 4, subjects: ["國文", "英文"] },
            { college: "醫學院", deptCat: "其他醫學", school: "中國醫藥", dept: "職業安全衛生學系", group: "", quota: 2, subjects: ["國文", "英文", "普通生物"] },
            { college: "醫學院", deptCat: "其他醫學", school: "中國醫藥", dept: "藥用化妝品學系", group: "", quota: 2, subjects: ["國文", "英文", "普通生物", "普通化學"] },
            { college: "醫學院", deptCat: "其他醫學", school: "高雄醫學", dept: "香妝品學系", group: "", quota: 2, subjects: ["國文", "英文", "普通生物", "普通化學"] },
            { college: "醫學院", deptCat: "其他醫學", school: "中國醫藥", dept: "醫療資訊學系", group: "", quota: 2, subjects: ["國文", "英文"] },
            { college: "醫學院", deptCat: "其他醫學", school: "中山醫學", dept: "醫學資訊學系", group: "", quota: 2, subjects: ["國文", "英文"] },
            { college: "醫學院", deptCat: "其他醫學", school: "慈濟大學", dept: "醫學資訊學系", group: "", quota: 2, subjects: ["國文", "英文"] },
            { college: "醫學院", deptCat: "其他醫學", school: "輔仁大學", dept: "醫學資訊與創新應用", group: "學士學位學程", quota: 1, subjects: ["書審"] }
        ];

        const popularSubjList = ["國文", "英文", "微積分", "普通物理", "普通化學", "普通生物", "計算機概論", "經濟學", "會計學", "民法總則", "刑法總則", "政治學", "護理學導論", "書審", "面試"];

        let currentCollege = "醫學院";
        let currentDeptCat = "護理";
        let selectedFilterSubjs = [];
        let currentFilterLogic = "OR";

        function setFilterLogic(logic) {
            currentFilterLogic = logic;
            const orBtn = document.getElementById('logicOrBtn');
            const andBtn = document.getElementById('logicAndBtn');

            if (logic === 'OR') {
                orBtn.className = 'logic-btn active-or';
                andBtn.className = 'logic-btn';
            } else {
                orBtn.className = 'logic-btn';
                andBtn.className = 'logic-btn active-and';
            }
            renderTableData();
        }

        function renderSidebar() {
            const container = document.getElementById('sidebarMenu');
            container.innerHTML = '';

            menuStructure.forEach(item => {
                const block = document.createElement('div');
                block.className = 'college-block';

                const header = document.createElement('div');
                header.className = 'college-header';
                header.innerHTML = `<span>${item.college} ＞</span>`;
                block.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'dept-list-grid';

                item.depts.forEach(deptName => {
                    const btn = document.createElement('a');
                    btn.className = `dept-btn ${(item.college === currentCollege && deptName === currentDeptCat) ? 'active' : ''}`;
                    btn.innerText = deptName;
                    btn.onclick = () => {
                        currentCollege = item.college;
                        currentDeptCat = deptName;
                        
                        // 點選側邊欄時，若有篩選條件，清空關鍵字與考科，恢復單科系對應檢視
                        document.getElementById('searchInput').value = '';
                        selectedFilterSubjs = [];
                        renderSubjectFilters();
                        
                        updateActiveSidebarBtn();
                        renderTableData();
                    };
                    grid.appendChild(btn);
                });

                block.appendChild(grid);
                container.appendChild(block);
            });
        }

        function updateActiveSidebarBtn() {
            document.querySelectorAll('.dept-btn').forEach(btn => {
                const isActive = (btn.innerText === currentDeptCat);
                btn.classList.toggle('active', isActive);
            });
        }

        function renderSubjectFilters() {
            const container = document.getElementById('subjectFilterBox');
            container.innerHTML = '';

            popularSubjList.forEach(subj => {
                const chip = document.createElement('div');
                chip.className = `subj-chip ${selectedFilterSubjs.includes(subj) ? 'active' : ''}`;
                chip.innerText = subj;
                chip.onclick = () => {
                    if (selectedFilterSubjs.includes(subj)) {
                        selectedFilterSubjs = selectedFilterSubjs.filter(s => s !== subj);
                    } else {
                        selectedFilterSubjs.push(subj);
                    }
                    renderSubjectFilters();
                    renderTableData();
                };
                container.appendChild(chip);
            });
        }

        function renderTableData() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';

            // 判斷當前是否正在進行搜尋或條件篩選
            const isFiltering = (keyword.length > 0 || selectedFilterSubjs.length > 0);

            // 更新 Banner 標頭動態顯示
            const bannerTitle = document.getElementById('displayTitle');
            if (isFiltering) {
                let filterConditions = [];
                if (keyword) filterConditions.push(`關鍵字「${keyword}」`);
                if (selectedFilterSubjs.length > 0) filterConditions.push(`考科 [${selectedFilterSubjs.join(' + ')}] (${currentFilterLogic})`);
                
                bannerTitle.innerHTML = `<span>🔍</span> 跨院系全校系搜尋：<span style="color:var(--primary-blue); font-size:1.1rem; margin-left:0.2rem;">${filterConditions.join('，')}</span>`;
            } else {
                const noSuffixDepts = ['醫檢放射', '食品營養', '中醫/牙醫', '獸醫', '藥學', '公共衛生', '生物醫學', '物理治療', '醫務管理', '護理', '其他醫學', '其他工科', '其他文科'];
                const deptTitleText = currentDeptCat + (noSuffixDepts.includes(currentDeptCat) || currentDeptCat.endsWith('系') ? '' : '系');
                bannerTitle.innerHTML = `<span>📄</span> ${currentCollege} ＞ ${deptTitleText}`;
            }

            const filtered = rawExamData.filter(item => {
                // 如果沒有輸入關鍵字也沒有勾選考科，僅顯示當前選擇的目錄科系
                if (!isFiltering) {
                    if (item.deptCat !== currentDeptCat) return false;
                }

                // 1. 關鍵字過濾（可搜尋學校、科系、組別或學院名稱）
                if (keyword) {
                    const matchSchool = item.school.toLowerCase().includes(keyword);
                    const matchDept = item.dept.toLowerCase().includes(keyword);
                    const matchGroup = item.group ? item.group.toLowerCase().includes(keyword) : false;
                    const matchCollege = item.college.toLowerCase().includes(keyword);
                    if (!matchSchool && !matchDept && !matchGroup && !matchCollege) return false;
                }

                // 2. 考科 AND / OR 邏輯跨院系過濾
                if (selectedFilterSubjs.length > 0) {
                    if (currentFilterLogic === 'AND') {
                        // AND 邏輯：該校系考科必須「同時包含所有」勾選的標籤
                        const hasAllSubjs = selectedFilterSubjs.every(s => item.subjects.includes(s));
                        if (!hasAllSubjs) return false;
                    } else {
                        // OR 邏輯：該校系考科只要「包含任意一科」勾選的標籤即可
                        const hasAnySubj = selectedFilterSubjs.some(s => item.subjects.includes(s));
                        if (!hasAnySubj) return false;
                    }
                }

                return true;
            });

            document.getElementById('resultCount').innerText = filtered.length;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-state">⚠️ 全資料庫中查無符合條件之轉學考招生數據。您可以切換「AND / OR 篩選模式」、「重設篩選」或調整關鍵字。</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const tr = document.createElement('tr');

                const subjBadges = item.subjects.map(s => {
                    const isDoc = s.includes('書審');
                    return `<span class="subj-badge ${isDoc ? 'doc-review' : ''}">${s}</span>`;
                }).join('');

                // 若在【跨系搜尋模式】下，呈現科系時自動加上學院類別標籤，提升比對可讀性
                const deptDisplay = isFiltering 
                    ? `<span class="college-tag">${item.college}-${item.deptCat}</span><br><strong>${item.dept}</strong>`
                    : item.dept;

                tr.innerHTML = `
                    <td style="font-weight: 700; color: var(--text-dark);">${item.school}</td>
                    <td style="color: var(--primary-blue); text-align: center;">${deptDisplay}</td>
                    <td>${item.group || ''}</td>
                    <td class="quota-num">${item.quota}</td>
                    <td>${subjBadges}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('resetBtn').onclick = () => {
            document.getElementById('searchInput').value = '';
            selectedFilterSubjs = [];
            currentFilterLogic = 'OR';
            setFilterLogic('OR');
            renderSubjectFilters();
            updateActiveSidebarBtn();
            renderTableData();
        };

        document.getElementById('searchInput').addEventListener('input', renderTableData);

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderSubjectFilters();
            updateActiveSidebarBtn();
            renderTableData();
        });
    </script>
</body>
</html>
